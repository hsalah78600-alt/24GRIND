@media (prefers-reduced-motion:no-preference){#splash i:after{animation:spl 1s ease-in-out infinite alternate}@keyframes spl{from{transform:translateX(-100%)}to{transform:translateX(250%)}}.btn,.tabs button,.item,.chip{transition:transform .12s,background-color .15s}.btn:active,.tabs button:active,.item:active{transform:scale(.97)}#main.pg{animation:pgin .22s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

  if(!C.user||!CLOUD||isCoach()||gate())return;

function applyChunksTo(T,docs){
  const core=docs.core;if(!core)return false;
  ['profile','routines','customEx','water','sleep','mood','weights','measures','habits','favFoods','customFoods','ach','settings'].forEach(k=>{if(core[k]!==undefined)T[k]=core[k]});
  T.profile=Object.assign(defState().profile,T.profile);

  T.updated=core.updated||0;
  const w=[],c=[],m={};
  Object.keys(docs).forEach(id=>{const d=docs[id];
    if(id.startsWith('w-'))w.push(...(d.items||[]));
    else if(id.startsWith('c-'))c.push(...(d.items||[]));
    else if(id.startsWith('m-'))Object.assign(m,d.days||{});});
  T.workouts=w.sort((a,b)=>a.ts-b.ts);T.cardio=c.sort((a,b)=>a.ts-b.ts);T.meals=m;

function streakInfo(){
  const set=activeDates();let d=new Date(),n=0;
  if(!set.has(dkey(d)))d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){n++;d.setDate(d.getDate()-1)}
  const arr=[...set].sort();let best=0,cur=0,prev=null;
  arr.forEach(k=>{const dt=parseKey(k);if(prev&&Math.round((dt-prev)/864e5)===1)cur++;else cur=1;if(cur>best)best=cur;prev=dt});
  return{n,set,best};
}

function imgToData(file,max,q,sq){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type||'')){rej(new Error('type'));return}
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{
      const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas'),x=c.getContext('2d');
      x.fillStyle='#fff';
      if(sq){const s=Math.min(W,H);c.width=c.height=max;x.fillRect(0,0,max,max);x.drawImage(im,(W-s)/2,(H-s)/2,s,s,0,0,max,max)}
      else{const k=Math.min(1,max/Math.max(W,H));c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height)}
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    }catch(e){rej(e)}};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};im.src=url;
  });
}

  const buf=new ArrayBuffer(44+len*2),dv=new DataView(buf),w=(off,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i))};

      const rate=ctx.sampleRate;try{ctx.close()}catch(e){}

function chatInfo(el){const uid=C.user&&C.user.uid;
  if(el.id==='msgs')return {th:uid,me:'client'};
  if(el.id==='cmsgs')return {th:U.cc&&U.cc.sel&&U.cc.sel.uid,me:'coach'};

function rdKey(th){return 'forma.rd.'+((C.user&&C.user.uid)||'x')+'.'+th}
function rdGet(th,bs,me){let v=null;try{v=localStorage.getItem(rdKey(th))}catch(e){}
  if(v!==null)return +v||0;
  let m=0;bs.forEach(b=>{if(b.dataset.f===me){const t=+b.dataset.ts||0;if(t>m)m=t}});return m}
function chatRead(el){
  if(!el||!el.isConnected||document.visibilityState!=='visible')return;
  const I=chatInfo(el);if(!I||!I.th)return;
  const r=el.getBoundingClientRect();if(r.height<20||r.bottom<0||r.bottom>innerHeight+8)return;
  if(el.scrollHeight-el.scrollTop-el.clientHeight>30)return;
  const bs=el.querySelectorAll('.bub');if(!bs.length)return;
  const t=+bs[bs.length-1].dataset.ts||0;
  try{if(t>(+localStorage.getItem(rdKey(I.th))||0)){localStorage.setItem(rdKey(I.th),String(t));try{navBadges()}catch(e){}}}catch(e){}
}
function chatPos(el,mode){
  const I=chatInfo(el);if(!I||!I.th)return;
  const bs=[].slice.call(el.querySelectorAll('.bub'));
  const old=el.querySelector('.newdiv');if(old)old.remove();
  if(!bs.length)return;
  const lr=rdGet(I.th,bs,I.me);
  const first=bs.find(b=>b.dataset.f!==I.me&&(+b.dataset.ts||0)>lr);
  let mark=null;
  if(first){mark=document.createElement('div');mark.className='newdiv';mark.textContent=_('رسايل جديدة');first.parentNode.insertBefore(mark,first)}
  if(mode==='unread'&&mark)el.scrollTop+=mark.getBoundingClientRect().top-el.getBoundingClientRect().top-6;
  else if(mode)el.scrollTop=el.scrollHeight;
  el.dataset.fx='1';
  if(!el.dataset.l){el.dataset.l='1';el.addEventListener('scroll',()=>chatRead(el),{passive:true})}
  setTimeout(()=>chatRead(el),350)
}
function chatSet(el,list,me){if(!el)return;const first=!el.dataset.fx,nb=el.scrollHeight-el.scrollTop-el.clientHeight<80;
  el.innerHTML=msgsHtml(list,me);chatPos(el,first?'unread':(nb?'bottom':false))}

    if(!(kg>0&&r>0)){o.innerHTML=_('<div class="muted">اكتب الوزن والعدّات.</div>');return}

function adjDays(id,sign,box){
  const a=findAcct(id);if(!a)return;
  const inp=box&&box.querySelector('.dayin');const n=Math.floor(pf(inp&&inp.value));
  if(!(n>=1&&n<=365)){toast(_('اكتب عدد أيام من 1 لـ 365'));return}
  const cur=effUntil(a);
  if(sign<0&&!cur){toast(_('الحساب لسه متفعّلش. اقبله الأول'));return}
  let u=sign>0?Math.max(Date.now(),cur)+n*864e5:cur-n*864e5;
  if(u<=Date.now()){
    if(!confirm(_('التقليل ده هيخلّي الاشتراك ينتهي فوراً والحساب يتقفل (بياناته هتفضل محفوظة). تكمل؟')))return;
    u=Date.now();
  }
  setAccess(id,{until:u,blocked:false},(sign>0?_('اتزوّد ')+n+_n(n,' يوم'):_('اتقلّل ')+n+_n(n,' يوم'))+' · '+fmtD(u));
  pushNotify(id,(C.profile&&C.profile.name)||'30 GRIND',_('اشتراكك اتعدّل لحد ')+fmtD(u),'sub');
}

function allActiveDates(){
  const s=new Set(activeDates());
  Object.keys(S.meals||{}).forEach(k=>{if((S.meals[k]||[]).length)s.add(k)});
  Object.keys(S.water||{}).forEach(k=>{if(+S.water[k]>0)s.add(k)});
  Object.keys(S.sleep||{}).forEach(k=>{if(S.sleep[k]&&+S.sleep[k].h>0)s.add(k)});
  Object.keys(S.mood||{}).forEach(k=>{if(S.mood[k])s.add(k)});
  Object.keys((S.habits&&S.habits.log)||{}).forEach(k=>{if((S.habits.log[k]||[]).length)s.add(k)});
  (S.weights||[]).forEach(w=>w.date&&s.add(w.date));(S.measures||[]).forEach(w=>w.date&&s.add(w.date));
  return s;
}
function adherence(){
  try{
    const t=targets(),days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(dkey(d))}
    const ws=weekStats(),goal=+S.profile.weekGoal||4;
    const tr=Math.min(100,Math.round(ws.n/goal*100));
    let fd=0,wt=0;const g=waterGoalMl();
    days.forEach(k=>{const k2=dayTotals(k).k;if(k2>0&&k2>=t.kcal*.8&&k2<=t.kcal*1.15)fd++;if((+S.water[k]||0)>=g*.8)wt++});
    fd=Math.round(fd/7*100);wt=Math.round(wt/7*100);
    const hl=(S.habits&&S.habits.list)||[];let hb=null;
    if(hl.length)hb=Math.round(days.reduce((a,k)=>a+hl.filter(h=>((S.habits.log[k]||[]).includes(h.id))).length,0)/(hl.length*7)*100);
    const parts=[tr,fd,wt].concat(hb==null?[]:[hb]);
    return{tr,fd,wt,hb,all:Math.round(parts.reduce((a,b)=>a+b,0)/parts.length)};
  }catch(e){return null}
}

function _bi(){
  if(_REV)return;_REV={};_GL={};const EN=window.EN||{};
  const add=(a,b)=>{const x=norm(a),y=norm(b);if(!x||!y||x===y)return;(_GL[x]=_GL[x]||[]).includes(y)||_GL[x].push(y)};
  Object.keys(EN).forEach(k=>{const v=EN[k];if(typeof v!=='string'||/[<>{}]/.test(k)||k.length>60)return;_REV[v]=k;
    const a=k.split(/\s+/),b=v.split(/\s+/);if(a.length===b.length&&a.length<=4)a.forEach((w,i)=>{add(w,b[i]);add(b[i],w)})});
}

function gdToken(interactive){return new Promise(async(res,rej)=>{
  if(GD.tok&&Date.now()<GD.exp-60000)return res(GD.tok);
  try{await gdLoad()}catch(e){return rej(e)}
  try{
    const tc=google.accounts.oauth2.initTokenClient({client_id:GD.cid,scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r&&r.access_token){GD.tok=r.access_token;GD.exp=Date.now()+(+r.expires_in||3600)*1000;res(GD.tok)}else rej(new Error((r&&r.error)||'denied'))},
      error_callback:e=>rej(new Error((e&&e.type)||'popup'))});
    tc.requestAccessToken({prompt:interactive?'':'none'});
  }catch(e){rej(e)}
})}
async function gdApi(url,opt,tok){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},(opt&&opt.headers)||{})}));
  if(r.status===401){GD.tok=null}
  if(!r.ok)throw new Error('drive '+r.status);
  return r;
}
async function gdFolder(tok){
  const q=encodeURIComponent("name='30 GRIND Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await (await gdApi('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&spaces=drive',{},tok)).json();
  if(j.files&&j.files[0])return j.files[0].id;
  const c=await (await gdApi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'30 GRIND Backups',mimeType:'application/vnd.google-apps.folder'})},tok)).json();
  return c.id;
}
async function gdUpload(json,interactive){
  const tok=await gdToken(interactive);
  const folder=await gdFolder(tok);
  let body=new Blob([json],{type:'application/json'}),name='30grind-backup-'+dkey()+'.json',mime='application/json';
  if(body.size>4.5e6&&window.CompressionStream){
    const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    body=await new Response(cs).blob();name+='.gz';mime='application/gzip';
  }
  const bd='g30'+Math.random().toString(36).slice(2);
  const meta=JSON.stringify({name,parents:[folder],mimeType:mime});
  const mp=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: '+mime+'\r\n\r\n',body,'\r\n--'+bd+'--'],{type:'multipart/related; boundary='+bd});
  await gdApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:mp},tok);
  gdSet('linked','1');gdSet('last',String(Date.now()));
  try{ // keep the newest 12 copies
    const q=encodeURIComponent("'"+folder+"' in parents and trashed=false");
    const l=await (await gdApi('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy=createdTime desc&fields=files(id)&pageSize=100',{},tok)).json();
    for(const f of (l.files||[]).slice(12))await gdApi('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE'},tok).catch(()=>{});
  }catch(e){}
}
async function gdLatestJson(){
  const l=await BK.all();if(l[0]&&Date.now()-l[0].ts<864e5)return l[0].json;
  const o=await bkBuild(false);const j=JSON.stringify(o);try{await BK.put({ts:o.ts,n:o.clients.length,json:j})}catch(e){}return j;
}
FX.gdup=async function(){
  if(GD.busy)return;GD.busy=true;GD.err='';
  try{
    if(!(C.clients||[]).length){toast(_('مفيش عملاء لسه'));GD.busy=false;return}
    toast(_('بنجهّز النسخة ونرفعها…'));
    await gdUpload(await gdLatestJson(),true);toast(_('اترفعت على Google Drive ✓'));
  }catch(e){GD.err=String((e&&e.message)||e);toast(_('تعذر الرفع على Drive. راجع الإعدادات وجرّب تاني.'))}
  GD.busy=false;try{render()}catch(e){}
};
async function gdAuto(){
  if(GD.busy||GD.tried||gdGet('linked')!=='1'||!isCoach()||isAdminUser()||!C.user||!(C.clients||[]).length)return;
  if(Date.now()-(+gdGet('last')||0)<7*864e5)return;
  GD.tried=true;GD.busy=true;
  try{await gdUpload(await gdLatestJson(),false)}catch(e){GD.err=String((e&&e.message)||e)}
  GD.busy=false;try{render()}catch(e){}
}
setInterval(()=>{try{gdAuto()}catch(e){}},60000);
function gdCard(){
  if(!isCoach()||isAdminUser())return '';
  const last=+gdGet('last')||0,linked=gdGet('linked')==='1';
  const stale=linked&&Date.now()-last>=7*864e5;
  return '<div class="card"><h3 style="margin:0 0 6px">'+esc(_('نسخة دايمة على Google Drive'))+'</h3><div class="muted" style="margin-bottom:8px">'+esc(_('بترفع نسخة من بيانات عملائك على Drive بتاعك (فولدر "30 GRIND Backups") كل أسبوع، وبتفضل محفوظة حتى لو الجهاز اتمسح.'))+'</div>'
   +(linked?'<div class="muted" style="margin-bottom:8px">'+esc(_('آخر رفع: '))+(last?esc(fmtD(last)):'—')+(stale?' · <b style="color:var(--danger)">'+esc(_('محتاج رفع جديد'))+'</b>':'')+'</div>':'')
   +(GD.err&&!GD.busy?'<div class="muted" style="color:var(--danger);margin-bottom:8px">'+esc(_('آخر محاولة فشلت، دوس ارفع الآن.'))+'</div>':'')
   +'<button class="btn block" data-act="gdup"'+(GD.busy?' disabled':'')+'>☁ '+esc(linked?_('ارفع الآن'):_('اربط Google Drive وارفع'))+'</button></div>';
}
(function(){const o=coachTools;coachTools=function(){const b=o();return b?b+gdCard():b}})();
